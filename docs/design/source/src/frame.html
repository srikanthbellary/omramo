<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omramo v2 — presentation frame</title>
<style>
  /* Presentation frame for the raw screenshots: frame.html?s=03-read-low&folded=0
     The device is an illustrative iPhone Duo shell (two panes + hinge), not an Apple asset. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 18%,#FBFAFF 0%,#ECE9FB 46%,#D9D4F3 100%)}
  .floor{position:absolute;left:50%;bottom:54px;width:860px;height:60px;margin-left:-430px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,24,110,.34),rgba(40,24,110,0));filter:blur(10px)}
  .folded .floor{width:420px;margin-left:-210px;bottom:50px}
  .device{position:relative;width:910px;height:738px;border-radius:50px;
    background:linear-gradient(145deg,#3B3A45,#1B1A22 40%,#0E0D13);
    box-shadow:0 0 0 1.5px #55535F,0 0 0 3px #1A1920,0 40px 70px -18px rgba(30,18,90,.5),0 18px 30px -12px rgba(30,18,90,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
  .screen{position:absolute;top:9px;width:432px;height:720px;background-repeat:no-repeat;background-size:892px 720px;overflow:hidden}
  .screen.l{left:9px;border-radius:41px 9px 9px 41px;background-position:0 0}
  .screen.r{left:469px;border-radius:9px 41px 41px 9px;background-position:-460px 0}
  .screen::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55);
    background:linear-gradient(112deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 22%)}
  .hinge{position:absolute;left:446px;top:0;width:18px;height:738px;
    background:linear-gradient(90deg,#08080B 0%,#3A3944 22%,#8D8B99 48%,#4A4954 62%,#15141A 100%)}
  .hinge::before,.hinge::after{content:"";position:absolute;left:0;width:18px;height:2px;background:rgba(0,0,0,.6)}
  .hinge::before{top:86px}.hinge::after{bottom:86px}
  .folded .device{width:456px;border-radius:50px 50px 50px 50px;
    box-shadow:0 0 0 1.5px #55535F,0 0 0 3px #1A1920,-7px 0 0 -1px #2A2932,-9px 0 0 -1px #6C6A78,-12px 0 0 -2px #1A1920,0 40px 70px -18px rgba(30,18,90,.5),0 18px 30px -12px rgba(30,18,90,.35)}
  .folded .screen.l{left:12px;border-radius:40px;background-size:432px 720px}
  .folded .screen.r,.folded .hinge{display:none}
</style>
</head>
<body>
<div class="floor"></div>
<div class="device"><div class="screen l" id="l"></div><div class="hinge"></div><div class="screen r" id="r"></div></div>
<script>
  var q = new URLSearchParams(location.search), s = q.get('s'), folded = q.get('folded') === '1';
  if (folded) document.body.classList.add('folded');
  var url = 'url("../png/' + s + '.png")';
  document.getElementById('l').style.backgroundImage = url;
  document.getElementById('r').style.backgroundImage = url;
</script>
</body>
</html>
