<?xml version="1.0" encoding="UTF-8"?>
<!--
  Omramo app icon (round 4). Our own drawing; no third-party art.

  Idea: the "O" of OMRAMO as the two panes of the reader, either side of the fold, and inside
  it one small place: the warm, low sun of every Omramo picture (docs/ART_DIRECTION.md §1)
  rising over calm water, running unbroken under the fold — "the page is a place". On the
  brand's midnight indigo. Few shapes, so it still reads at 29 pt: two white half rings, a
  warm sky with a sun, dark water.

  Rendered to PNG by tools/make_app_icon.py (headless Chrome, then flattened to RGB: the App
  Store icon must have no alpha). iOS applies its own corner mask: the art is a full square.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#33248F"/>
      <stop offset="0.55" stop-color="#1F1856"/>
      <stop offset="1" stop-color="#130F36"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E56FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6E56FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5C7A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF5C7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19C7A2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#19C7A2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB45A" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#FF8A4D" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF7A4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0.25" y1="0" x2="0.7" y2="1">
      <stop offset="0.08" stop-color="#FFDF7A"/>
      <stop offset="0.55" stop-color="#FF8A4D"/>
      <stop offset="1" stop-color="#FF4D7A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F6F1FF"/>
      <stop offset="1" stop-color="#DCD3FF"/>
    </linearGradient>
    <linearGradient id="seamTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25A" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <linearGradient id="seamBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A4D"/>
      <stop offset="0.55" stop-color="#FF7A4D"/>
      <stop offset="1" stop-color="#FF7A4D" stop-opacity="0"/>
    </linearGradient>
    <!-- The fold: a gap through the ring, top to bottom. -->
    <mask id="fold" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="486" y="0" width="52" height="1024" fill="#000"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9B8"/>
      <stop offset="0.5" stop-color="#FFC978"/>
      <stop offset="1" stop-color="#FF9A66"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3FE0"/>
      <stop offset="0.35" stop-color="#3A2BB0"/>
      <stop offset="1" stop-color="#1F1856"/>
    </linearGradient>
    <clipPath id="inside">
      <circle cx="512" cy="512" r="232"/>
    </clipPath>
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="1024" height="548"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Ground: midnight indigo with the aurora's three colours. -->
  <rect width="1024" height="1024" fill="url(#night)"/>
  <circle cx="170" cy="150" r="520" fill="url(#violet)"/>
  <circle cx="900" cy="930" r="520" fill="url(#rose)"/>
  <circle cx="940" cy="90" r="380" fill="url(#teal)"/>

  <!-- The warm light at the heart. -->
  <circle cx="512" cy="512" r="470" fill="url(#warm)"/>

  <!-- A soft shadow under the ring, toward the lower right (light from the upper left). -->
  <g mask="url(#fold)" opacity="0.35" filter="url(#soft)">
    <circle cx="526" cy="532" r="286" fill="none" stroke="#0B0726" stroke-width="124"/>
  </g>

  <!-- The O, as two panes either side of the fold. -->
  <g mask="url(#fold)">
    <circle cx="512" cy="512" r="286" fill="none" stroke="url(#ring)" stroke-width="124"/>
  </g>

  <!-- The place inside the O: sky, the low warm sun, calm water. It runs under the fold. -->
  <g clip-path="url(#inside)">
    <rect x="260" y="260" width="504" height="290" fill="url(#sky)"/>
    <g clip-path="url(#aboveHorizon)">
      <circle cx="512" cy="548" r="196" fill="#FFF3C4" opacity="0.45"/>
      <circle cx="512" cy="548" r="128" fill="url(#sun)"/>
    </g>
    <rect x="260" y="548" width="504" height="230" fill="url(#water)"/>
    <!-- The sun's path on the water: three short, soft lines. -->
    <rect x="452" y="574" width="120" height="16" rx="8" fill="#FFC978" opacity="0.9"/>
    <rect x="474" y="616" width="76" height="14" rx="7" fill="#FFB05A" opacity="0.7"/>
    <rect x="490" y="654" width="44" height="12" rx="6" fill="#FF9A66" opacity="0.5"/>
  </g>

  <!-- The seam of light in the fold, above and below the O's opening. -->
  <rect x="505" y="128" width="14" height="146" rx="7" fill="url(#seamTop)"/>
  <rect x="505" y="750" width="14" height="146" rx="7" fill="url(#seamBottom)"/>
</svg>
